name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # No secrets or external database needed: the suite runs against
      # mongodb-memory-server (ADR-033), and jest.config.js loads
      # tests/setup/env.js which supplies JWT_SECRET and friends before
      # app.js is ever imported.
      - name: Run tests
        working-directory: server
        run: npm test

  client-build:
    name: Client build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      # A placeholder value is enough here: NEXT_PUBLIC_API_URL is only
      # dereferenced at request time, but it must be defined so the build
      # doesn't inline `undefined`. This step exists to catch build-time
      # failures that never surface in `next dev` — the first Vercel
      # deploy (ADR-050) failed on exactly that: useSearchParams outside a
      # Suspense boundary, which only breaks during static prerendering.
      - name: Build
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build
